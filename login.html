<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Arcane Clash — Entrar</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#fff;
    background-image:linear-gradient(180deg, rgba(5,6,15,.35) 0%, rgba(5,6,15,.55) 55%, rgba(5,6,15,.85) 100%), url('login-bg.png');
    background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed;}
  .login-content{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:360px;padding:20px}
  .brand-mark{font-size:26px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#7b5cff,#42efff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand-sub{font-size:12px;letter-spacing:4px;color:#8ea2ff;opacity:.8}
  .login-box{margin-top:18px;width:100%;background:rgba(10,12,25,.72);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:20px;backdrop-filter:blur(10px);box-shadow:0 8px 40px rgba(0,0,0,.5), 0 0 40px rgba(123,92,255,.15)}
  .login-tabs{display:flex;gap:8px;margin-bottom:16px}
  .login-tab{flex:1;padding:10px;border-radius:10px;border:none;background:rgba(255,255,255,.06);color:#9aa3c7;font-weight:700;cursor:pointer;font-size:14px}
  .login-tab.active{background:linear-gradient(135deg,#7b5cff,#42efff);color:#0a0d1c}
  .login-form{display:flex;flex-direction:column;gap:10px}
  .login-form.hidden{display:none}
  .login-form input{padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-size:15px}
  .login-form input::placeholder{color:#6b7399}
  .btn-primary{padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#7b5cff,#42efff);color:#0a0d1c;font-weight:800;font-size:15px;cursor:pointer}
  .login-link{background:none;border:none;color:#8ea2ff;font-size:13px;margin-top:4px;cursor:pointer}
  .login-erro{margin-top:12px;color:#ff6b6b;font-size:13px;text-align:center}
  .login-erro.hidden{display:none}
  .login-ok{color:#5cffb0}
</style>
</head>
<body>

<div class="login-content">
  <div class="brand-mark">ARCANE CLASH</div>
  <div class="brand-sub">DUEL OF MAGIC</div>

  <div class="login-box">
    <div class="login-tabs">
      <button class="login-tab active" id="tab-entrar" type="button">Entrar</button>
      <button class="login-tab" id="tab-cadastrar" type="button">Cadastrar</button>
    </div>

    <div id="form-entrar" class="login-form">
      <input type="email" id="login-email" placeholder="E-mail" autocomplete="email">
      <input type="password" id="login-senha" placeholder="Senha" autocomplete="current-password">
      <button class="btn-primary" id="btn-fazer-login" type="button">ENTRAR</button>
      <button class="login-link" id="btn-esqueci-senha" type="button">Esqueci minha senha</button>
    </div>

    <div id="form-cadastrar" class="login-form hidden">
      <input type="text" id="cadastro-nome" placeholder="Nome de usuário (máx 15)" maxlength="15">
      <input type="email" id="cadastro-email" placeholder="E-mail" autocomplete="email">
      <input type="password" id="cadastro-senha" placeholder="Senha (mín 8 caracteres)" autocomplete="new-password">
      <button class="btn-primary" id="btn-fazer-cadastro" type="button">CRIAR CONTA</button>
    </div>

    <div id="form-recuperar" class="login-form hidden">
      <input type="email" id="recuperar-email" placeholder="Digite seu e-mail cadastrado">
      <button class="btn-primary" id="btn-enviar-recuperacao" type="button">ENVIAR LINK</button>
      <button class="login-link" id="btn-voltar-login" type="button">Voltar</button>
    </div>

    <div id="login-erro" class="login-erro hidden"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://nwithfitohtygvxrysgv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-JX98qu3_yPXqGp--R-aMw_nSHDBCOR';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function mostrarErro(msg, ok) {
  const el = document.getElementById('login-erro');
  el.textContent = msg;
  el.className = ok ? 'login-erro login-ok' : 'login-erro';
}
function limparErro() {
  document.getElementById('login-erro').className = 'login-erro hidden';
}
function mostrarFormulario(nome) {
  ['form-entrar', 'form-cadastrar', 'form-recuperar'].forEach((id) => {
    document.getElementById(id).classList.add('hidden');
  });
  document.getElementById(nome).classList.remove('hidden');
  limparErro();
}

document.getElementById('tab-entrar').addEventListener('click', () => {
  document.getElementById('tab-entrar').classList.add('active');
  document.getElementById('tab-cadastrar').classList.remove('active');
  mostrarFormulario('form-entrar');
});
document.getElementById('tab-cadastrar').addEventListener('click', () => {
  document.getElementById('tab-cadastrar').classList.add('active');
  document.getElementById('tab-entrar').classList.remove('active');
  mostrarFormulario('form-cadastrar');
});
document.getElementById('btn-esqueci-senha').addEventListener('click', () => mostrarFormulario('form-recuperar'));
document.getElementById('btn-voltar-login').addEventListener('click', () => {
  document.getElementById('tab-entrar').classList.add('active');
  document.getElementById('tab-cadastrar').classList.remove('active');
  mostrarFormulario('form-entrar');
});

document.getElementById('btn-fazer-login').addEventListener('click', async () => {
  limparErro();
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  if (!email || !senha) return mostrarErro('Preencha e-mail e senha.');

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
  if (error) return mostrarErro('E-mail ou senha incorretos.');

  sessionStorage.setItem('acabouDeLogar','1'); window.location.href = 'index.html';
});

document.getElementById('btn-fazer-cadastro').addEventListener('click', async () => {
  limparErro();
  const nome = document.getElementById('cadastro-nome').value.trim();
  const email = document.getElementById('cadastro-email').value.trim();
  const senha = document.getElementById('cadastro-senha').value;

  if (!nome || nome.length > 15) return mostrarErro('Nome inválido (máx 15 caracteres).');
  if (!email) return mostrarErro('Digite um e-mail.');
  if (!senha || senha.length < 8) return mostrarErro('Senha precisa ter no mínimo 8 caracteres.');

  const { data, error } = await supabaseClient.auth.signUp({ email, password: senha });
  if (error) return mostrarErro('Erro ao criar conta: ' + error.message);

  const userId = data.user?.id;
if (userId) {
  const { error: erroInsert } = await supabaseClient
    .from('Player')
    .upsert({ user_id: userId, username: nome }, { onConflict: 'user_id' });

  if (erroInsert) {
    mostrarErro('Conta criada, mas houve um erro salvando o perfil: ' + erroInsert.message);
    return;
  }
}
  sessionStorage.setItem('acabouDeLogar','1'); window.location.href = 'index.html';
});

document.getElementById('btn-enviar-recuperacao').addEventListener('click', async () => {
  limparErro();
  const email = document.getElementById('recuperar-email').value.trim();
  if (!email) return mostrarErro('Digite seu e-mail.');

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname.replace('login.html', 'index.html')
  });

  if (error) return mostrarErro('Erro ao enviar. Tente novamente.');
  mostrarErro('Link enviado! Confira seu e-mail (e o spam).', true);
});

// Se já tem sessão ativa, pula direto pro jogo
(async function () {
  const { data } = await supabaseClient.auth.getSession();
  if (data.session) { sessionStorage.setItem('acabouDeLogar','1'); window.location.href = 'index.html'; }
})();
</script>
</body>
</html>
