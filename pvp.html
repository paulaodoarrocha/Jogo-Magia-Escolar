<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Arcane Clash — Arena PvP</title>
<style>
  :root{
    --bg:#06070f; --panel:rgba(14,16,32,.82); --border:rgba(255,255,255,.1);
    --grad1:#7b5cff; --grad2:#42efff; --gold:#ffd166; --danger:#ff5c6c; --ok:#5cffb0;
    --bronze:#c07a3e; --prata:#c7d0da; --ouro:#ffd166; --diamante:#7ee8ff; --desafiante:#ff5cf1;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#161c3d 0%,#06070f 60%);
    font-family:system-ui,sans-serif;color:#fff;overflow-x:hidden}
  .hidden{display:none!important}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    background:rgba(8,9,20,.7);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
  .topbar .title{font-weight:900;letter-spacing:1px;background:linear-gradient(135deg,var(--grad1),var(--grad2));
    -webkit-background-clip:text;background-clip:text;color:transparent;font-size:18px}
  .btn-voltar{background:rgba(255,255,255,.08);border:1px solid var(--border);color:#fff;padding:8px 12px;
    border-radius:10px;font-weight:700;cursor:pointer;font-size:13px}
  .container{max-width:520px;margin:0 auto;padding:16px 14px 90px;position:relative}

  /* ===== CARD RANK/PERFIL ===== */
  .pocao-ativa-badge{background:linear-gradient(135deg,rgba(57,255,138,.18),rgba(57,255,138,.06));border:1px solid rgba(57,255,138,.4);color:#39ff8a;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
  .profile-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px;
    display:flex;align-items:center;gap:14px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .avatar-ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:30px;background:#12142a;border:3px solid var(--rank-color,#c07a3e);flex-shrink:0;overflow:hidden}
  .avatar-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover}
  .profile-info{flex:1;min-width:0}
  .profile-name{font-weight:800;font-size:16px}
  .rank-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.5px;
    padding:3px 9px;border-radius:20px;margin-top:4px;background:color-mix(in srgb,var(--rank-color,#c07a3e) 25%,transparent);
    color:var(--rank-color,#c07a3e);border:1px solid var(--rank-color,#c07a3e)}
  .stat-row{display:flex;gap:14px;margin-top:8px;font-size:12px;color:#9aa3c7}
  .stat-row b{color:#fff}
  .xp-bar-wrap{height:7px;border-radius:6px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}
  .xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--grad1),var(--grad2));border-radius:6px;transition:width .4s}

  /* ===== BOTÃO BATALHA ===== */
  .btn-batalha{width:100%;margin-top:18px;padding:20px;border:none;border-radius:20px;font-size:20px;font-weight:900;
    letter-spacing:1px;color:#0a0d1c;cursor:pointer;position:relative;overflow:hidden;
    background:linear-gradient(135deg,var(--grad1),var(--grad2));box-shadow:0 0 30px rgba(123,92,255,.5),0 8px 24px rgba(0,0,0,.4)}
  .btn-batalha:active{transform:scale(.97)}
  .btn-batalha::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);
    transform:translateX(-120%);animation:shine 3s infinite}
  @keyframes shine{60%{transform:translateX(120%)}100%{transform:translateX(120%)}}
  .btn-locked{opacity:.45;filter:grayscale(.6)}

  /* ===== TABS ===== */
  .tabs{display:flex;gap:8px;margin-top:18px;overflow-x:auto;padding-bottom:2px}
  .tab-btn{flex:none;padding:9px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.05);
    color:#9aa3c7;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
  .tab-btn.active{background:linear-gradient(135deg,var(--grad1),var(--grad2));color:#0a0d1c;border-color:transparent}
  .panel{margin-top:14px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px}

  /* ===== CARDS GENÉRICOS ===== */
  .item-card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;
    border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--border);margin-bottom:10px}
  .item-card.locked{opacity:.4}
  .item-name{font-weight:700;font-size:14px}
  .item-sub{font-size:11px;color:#9aa3c7;margin-top:2px}
  .btn-buy{background:linear-gradient(135deg,#ffd166,#ff9d1a);color:#3a2200;border:none;border-radius:10px;
    padding:8px 12px;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap}
  .btn-buy:disabled{opacity:.4;cursor:not-allowed}

  .ranking-row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px}
  .ranking-row:nth-child(odd){background:rgba(255,255,255,.03)}
  .ranking-pos{width:26px;font-weight:900;color:var(--gold);text-align:center}

  /* ===== OVERLAYS DE FLUXO ===== */
  .overlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#161c3d,#04050b 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;text-align:center;padding:20px}
  .search-symbol{font-size:38px;font-weight:900;letter-spacing:8px;color:var(--grad2);text-shadow:0 0 20px var(--grad2);
    min-height:48px}
  .search-label{margin-top:14px;font-weight:700;letter-spacing:2px;color:#9aa3c7}
  .btn-cancelar{margin-top:26px;background:rgba(255,255,255,.08);border:1px solid var(--border);color:#fff;
    padding:10px 18px;border-radius:12px;cursor:pointer}

  .vs-wrap{display:flex;align-items:center;gap:16px;width:100%;max-width:440px}
  .vs-player{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;
    animation:slideIn .5s ease}
  .vs-player:last-child{animation:slideInR .5s ease}
  @keyframes slideIn{from{transform:translateX(-60px);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes slideInR{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
  .vs-avatar{width:56px;height:56px;border-radius:50%;background:#12142a;display:flex;align-items:center;
    justify-content:center;font-size:26px;margin:0 auto 8px;border:2px solid var(--grad2);overflow:hidden}
  .vs-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
  .vs-mid{font-weight:900;font-size:26px;color:var(--danger);text-shadow:0 0 16px var(--danger)}

  .countdown-num{font-size:80px;font-weight:900;color:var(--grad2);text-shadow:0 0 30px var(--grad2)}
  .cenario-card{border-radius:12px;overflow:hidden;border:2px solid var(--border);cursor:pointer;position:relative;aspect-ratio:1}
  .cenario-card img{width:100%;height:100%;object-fit:cover;display:block}
  .cenario-card.selecionado{border-color:var(--grad2);box-shadow:0 0 14px rgba(66,239,255,.6)}
  .cenario-card .cenario-nome{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);font-size:10px;font-weight:700;text-align:center;padding:3px 2px}

  /* ===== ARENA DE BATALHA ===== */
  .arena{position:fixed;inset:0;background:linear-gradient(180deg,#0e1230,#04050b);z-index:40;display:flex;
    flex-direction:column}
  .hp-zone{padding:14px;display:flex;flex-direction:row;gap:10px;align-items:center}
  .hp-line{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .hp-line.foe{flex-direction:row-reverse}
  .hp-avatar{width:34px;height:34px;border-radius:50%;background:#12142a;border:2px solid var(--rank-color,var(--grad2));
    display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;overflow:hidden}
  .hp-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
  .hp-avatar.foe{border-color:var(--danger)}
  .hp-info{flex:1;min-width:0}
  .hp-name{font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:4px}
  .hp-line.foe .hp-name{flex-direction:row-reverse}
  .hp-bar-wrap{height:12px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:3px}
  .hp-bar-fill{height:100%;border-radius:8px;transition:width .3s;position:relative}
  .hp-bar-fill.me{background:linear-gradient(90deg,#39ff8a,#1ad1c9);box-shadow:0 0 10px rgba(57,255,138,.55)}
  .hp-bar-fill.foe{background:linear-gradient(90deg,#ff5c6c,#ff2d2d);box-shadow:0 0 10px rgba(255,45,45,.55)}
  .hp-bar-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    width:40%;animation:hpShine 2.4s ease-in-out infinite}
  @keyframes hpShine{0%{transform:translateX(-120%)}100%{transform:translateX(280%)}}
  .battle-mid{flex:1;display:flex;flex-direction:column;min-height:0}
  .battle-stage{position:relative;flex:1;display:flex;align-items:center;justify-content:space-between;
    padding:10px 22px;overflow:hidden;
    background:radial-gradient(ellipse at 50% 60%, rgba(123,92,255,.16) 0%, rgba(6,7,15,0) 70%);
    box-shadow:inset 0 0 60px rgba(66,239,255,.10);animation:vinhetaPulso 4s ease-in-out infinite}
  @keyframes vinhetaPulso{0%,100%{box-shadow:inset 0 0 60px rgba(66,239,255,.10)}50%{box-shadow:inset 0 0 90px rgba(123,92,255,.18)}}
  .battle-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.55}
  .battle-particles::before,.battle-particles::after{content:"";position:absolute;width:160%;height:160%;left:-30%;top:-30%;
    background:repeating-radial-gradient(circle at 20% 30%, rgba(123,92,255,.10) 0 2px, transparent 2px 60px),
               repeating-radial-gradient(circle at 80% 70%, rgba(66,239,255,.08) 0 2px, transparent 2px 70px);
    animation:driftBg 14s linear infinite;}
  .battle-particles::after{animation-duration:20s;animation-direction:reverse;opacity:.6}
  @keyframes driftBg{from{transform:translate(0,0)}to{transform:translate(-6%,6%)}}
  .fighter{position:relative;display:flex;flex-direction:column;align-items:center;z-index:2;transition:transform .22s ease}
  .move-controls{position:absolute;left:14px;bottom:96px;display:flex;gap:8px;z-index:5}
  .joystick-base{position:absolute;left:14px;bottom:86px;width:86px;height:86px;border-radius:50%;
    background:rgba(255,255,255,.06);border:1px solid var(--border);z-index:5;touch-action:none}
  .joystick-knob{position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,.18);border:1px solid var(--border);
    transform:translate(-50%,-50%);transition:transform .15s ease}
  .joystick-knob.arrastando{transition:none}
  .move-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,.08);
    color:#fff;font-size:18px;font-weight:900;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
  .move-btn:active{background:rgba(255,255,255,.2);transform:scale(.92)}
  .fighter-portrait{width:94px;height:94px;border-radius:0;background:transparent;
    border:none;display:flex;align-items:center;justify-content:center;
    font-size:40px;overflow:visible;animation:fighterIdle 2.6s ease-in-out infinite;
    filter:drop-shadow(0 0 14px rgba(123,92,255,.45))}
  .fighter-portrait img{width:100%;height:100%;object-fit:contain}
  .fighter-foe .fighter-portrait{filter:drop-shadow(0 0 14px rgba(255,45,45,.45));animation-delay:.3s}
  .fighter-shadow{width:38px;height:8px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(2px);margin-top:4px}
  /* Deixa claro qual dos dois é o seu personagem — importante porque os dois
     lados podem escolher o mesmo lutador (mesmo boss_equipado). */
  .fighter-voce-tag{position:absolute;top:-16px;left:50%;transform:translateX(-50%);
    background:linear-gradient(135deg,#42efff,#7b5cff);color:#04050b;font-size:9px;font-weight:900;
    letter-spacing:1px;padding:2px 8px;border-radius:20px;white-space:nowrap;z-index:3;
    box-shadow:0 0 8px rgba(66,239,255,.6)}
  @keyframes fighterIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  /* Animação leve de caminhada/corrida — só troca o transform do retrato (filho),
     nunca conflita com o transform de posição aplicado no .fighter (pai) via JS.
     Puramente CSS (sem JS por frame), então não pesa no celular. */
  .fighter.andando .fighter-portrait{animation:fighterWalk .42s ease-in-out infinite}
  @keyframes fighterWalk{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-4px) rotate(-4deg)}50%{transform:translateY(-1px) rotate(0deg)}75%{transform:translateY(-4px) rotate(4deg)}}
  .battle-vs-spark{font-size:20px;color:#ffd166;text-shadow:0 0 14px #ffd166;animation:sparkPulse 1.1s ease-in-out infinite;z-index:2}
  @keyframes sparkPulse{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
  .fighter.hit .fighter-portrait{animation:fighterHit .35s ease}
  @keyframes fighterHit{0%{filter:brightness(1) drop-shadow(0 0 14px rgba(123,92,255,.45))}30%{filter:brightness(2.2) drop-shadow(0 0 14px #ff2d2d);transform:translateX(-6px)}60%{transform:translateX(4px)}100%{filter:brightness(1) drop-shadow(0 0 14px rgba(123,92,255,.45));transform:translateX(0)}}
  .fighter.ko .fighter-portrait{filter:grayscale(1) brightness(.5);animation:none}
  .dmg-pop-zone{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:1px;height:1px;pointer-events:none}
  .dmg-pop{position:absolute;left:50%;top:0;transform:translateX(-50%);font-weight:900;font-size:15px;color:#ff5050;
    text-shadow:0 0 8px rgba(0,0,0,.6);white-space:nowrap;animation:dmgPop .8s ease-out forwards}
  .dmg-pop.heal{color:#39ff8a}
  .dmg-pop.dodge{color:#7ee8ff;font-size:12px}
  @keyframes dmgPop{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-38px) scale(1)}}
  .arena.shake{animation:arenaShake .32s ease}
  @keyframes arenaShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .battle-log{font-size:12px;color:#9aa3c7;text-align:center;padding:6px 10px 2px;min-height:16px}
  .battle-controls{display:flex;gap:10px;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .skill-btn{flex:1;padding:10px 6px 12px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.06);
    color:#fff;font-weight:800;font-size:12px;cursor:pointer;position:relative;display:flex;flex-direction:column;
    align-items:center;gap:6px;transition:transform .12s}
  .skill-btn:active:not(:disabled){transform:scale(.93)}
  .skill-btn .skill-icon{width:34px;height:34px;border-radius:10px;object-fit:cover;background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.25)}
  .skill-btn.ult{background:linear-gradient(135deg,#ff9d1a,#ff2d2d)}
  .skill-btn.ult .skill-icon{border-color:rgba(255,255,255,.5)}
  .skill-btn.em-cooldown{opacity:.55;filter:grayscale(.4)}
  .skill-cd{position:absolute;top:6px;right:8px;font-size:11px;font-weight:900;color:#42efff;
    text-shadow:0 0 6px rgba(66,239,255,.8);pointer-events:none}
  .skill-btn:disabled{opacity:.35}
  .skill-btn.usando{animation:skillPop .35s ease}
  @keyframes skillPop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
  /* Escudo agora mora na mesma fileira dos botões de skill (era um botão solto
     flutuando por cima do palco, brigando de espaço com o joystick — ficava feio
     e difícil de mirar no dedo). Reaproveita a classe .skill-btn como base. */
  .skill-btn.esc{background:linear-gradient(135deg,#1a2a4a,#0e1c33)}
  .skill-btn.esc .skill-icon-emoji{font-size:26px;line-height:1}
  .skill-btn.esc.ativo{background:linear-gradient(135deg,#42efff,#7b5cff);border-color:transparent;box-shadow:0 0 16px rgba(66,239,255,.6)}
  .skill-btn:disabled{cursor:not-allowed}
  .fighter.escudo-ativo .fighter-portrait{filter:drop-shadow(0 0 16px rgba(66,239,255,.85)) drop-shadow(0 0 26px rgba(66,239,255,.5))!important}
  /* Gif da skill/ultimate aparecendo por cima do lutador quando ele é usado */
  .skill-fx-img{position:absolute;left:50%;top:50%;width:150%;max-width:220px;height:auto;
    transform:translate(-50%,-50%);pointer-events:none;z-index:6;
    filter:drop-shadow(0 0 14px rgba(123,92,255,.6));animation:skillFxPop .75s ease-out forwards}
  @keyframes skillFxPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}

  /* Projétil da Skill 1/2/Ultimate: some elemento único que viaja do lutador que
     usou até o alvo (em vez do gif só "piscar" em cima de quem usou e o dano
     já ter sido aplicado). Fica dentro de #battle-stage (position:relative),
     então as coordenadas em px batem com as dos lutadores. */
  .skill-projectile{position:absolute;top:0;left:0;width:64px;height:64px;z-index:7;
    pointer-events:none;filter:drop-shadow(0 0 10px rgba(123,92,255,.55));will-change:transform}
  .skill-projectile img{width:100%;height:100%;object-fit:contain;display:block}
  /* Overlay do vídeo da Ultimate — reaproveita o mesmo padrão de arquivo usado na
     batalha dos bosses (Ultimate{N}.mp4). Agora em TELA CHEIA (position:fixed
     cobrindo a viewport toda), igual pedido, com botão de pular. Some sozinho
     quando o vídeo termina, quando alguém pula, ou (trava de segurança) depois
     de um tempo máximo — nunca fica travado nem impede ações depois. */
  .ultimate-video-overlay{position:fixed;inset:0;z-index:70;
    display:flex;align-items:center;justify-content:center;background:rgba(4,5,11,.92);
    pointer-events:none;opacity:0;transition:opacity .18s ease}
  .ultimate-video-overlay.ativo{opacity:1;pointer-events:auto}
  .ultimate-video-overlay video{max-width:100%;max-height:100%;object-fit:contain;
    filter:drop-shadow(0 0 22px rgba(123,92,255,.55))}
  .ultimate-video-skip{position:absolute;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));
    z-index:2;padding:9px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.35);
    background:rgba(10,12,25,.75);color:#fff;font-weight:800;font-size:13px;cursor:pointer}
  .ultimate-video-skip:active{background:rgba(255,255,255,.15)}

  /* ===== PROMOÇÃO DE RANK ===== */
  .promo-overlay{position:fixed;inset:0;background:rgba(4,5,11,.92);z-index:60;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center}
  .promo-rank-old{font-size:16px;color:#9aa3c7;letter-spacing:2px}
  .promo-arrow{font-size:30px;margin:6px 0;color:var(--grad2)}
  .promo-overlay.rebaixamento .promo-arrow{color:#ff5050}
  .promo-overlay.rebaixamento{background:radial-gradient(circle at 50% 55%, rgba(255,40,40,.18), rgba(5,6,15,.92))}
  .promo-rank-new{font-size:40px;font-weight:900;letter-spacing:2px;text-shadow:0 0 30px currentColor;
    animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  .promo-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .p-dot{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold);animation:rise 1.4s ease-out forwards}
  .recompensa-titulo{font-size:22px;font-weight:900;letter-spacing:2px;color:#3dffa0;text-shadow:0 0 24px rgba(61,255,160,.6);margin-bottom:14px}
  .recompensa-lista{display:flex;flex-direction:column;gap:8px;min-width:220px;margin-bottom:20px}
  .recompensa-item{display:flex;justify-content:space-between;gap:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 14px;font-size:14px}
  .recompensa-item b{color:#ffd166}
  .btn-fechar-recompensa{background:linear-gradient(135deg,#7b5cff,#42efff);color:#0a0d1c;border:none;border-radius:10px;padding:10px 26px;font-weight:800;cursor:pointer}
  @keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-160px);opacity:0}}

  .locked-msg{text-align:center;padding:40px 20px;color:#9aa3c7}
  .locked-msg b{color:var(--gold)}

  /* ===== THUMB DE PET NA LOJA ===== */
  .pet-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;
    border:2px solid var(--gold);box-shadow:0 0 10px rgba(255,209,102,.5);background:#0a0d1c}
  .pet-thumb.locked{filter:grayscale(1);opacity:.5;box-shadow:none;border-color:var(--border)}

const RANK_COLORS = {bronze:'#c07a3e',prata:'#c7d0da',ouro:'#ffd166',diamante:'#7ee8ff',desafiante:'#ff5cf1'};
const RANK_LABEL = {bronze:'BRONZE',prata:'PRATA',ouro:'OURO',diamante:'DIAMANTE',desafiante:'DESAFIANTE'};

const RANK_PONTAS = {bronze:1,prata:2,ouro:3,diamante:4,desafiante:5};
function emblemaPatente(rank, tamanho = 15) {
  const cor = RANK_COLORS[rank] || '#7b5cff';

  const marcas = Array.from({length: pontas}, (_, i) =>
    `<rect x="${5 + i * 3.4}" y="15" width="2.2" height="5" rx="0.6" fill="${cor}"/>`
  ).join('');
  return `<svg class="rank-emblema" viewBox="0 0 24 24" width="${tamanho}" height="${tamanho}" style="vertical-align:-3px;margin-right:3px;flex-shrink:0">
    <path fill="${cor}" fill-opacity=".22" stroke="${cor}" stroke-width="1.3" d="M12 2l4 2.3 4.6.6-1 4.4L21 13l-1.4 4.4-4.6.7L12 22l-3-3.9-4.6-.7L3 13l1.4-3.7-1-4.4L8 4.3z"/>
    <circle cx="12" cy="10.5" r="3.4" fill="${cor}"/>
    ${marcas}

}
const RANK_NIVEL = {bronze:1,prata:2,ouro:3,diamante:4,desafiante:5};

let perfilAtual = null;

function pocaoPvpRestanteMs(id) {
  const ate = pocoesPvpAtivas[id];
  if (!ate) return 0;
  return Math.max(0, ate - Date.now());
}
function formatarRestantePocao(ms) {
  const s = Math.ceil(ms / 1000);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${m}:${String(r).padStart(2, '0')}`;
}

const NOME_POCAO_PVP = {
  PocaoDiamantesPvp: '💎 Diamantes', PocaoMoedasPvp: '🪙 Moedas', PocaoDamagePvp: '⚔️ Damage',
  PocaoLuckyPvp: '🍀 Lucky', PocaoEscudoPvp: '🛡️ Escudo', PocaoRegeneracaoPvp: '💚 Regen',

};

  const el = document.getElementById('pocoes-pvp-ativas-header');

  const ativas = Object.keys(pocoesPvpAtivas).filter((id) => pocaoPvpRestanteMs(id) > 0);
  if (!ativas.length) { el.innerHTML = ''; return; }
  el.innerHTML = ativas.map((id) => `<span class="pocao-ativa-badge">${NOME_POCAO_PVP[id] || id} • ${formatarRestantePocao(pocaoPvpRestanteMs(id))}</span>`).join('');

  pvpLobbyMusic.volume = pvpMusicaLigada ? 0.07 : 0;

  const tentarTocar = () => { const p = pvpLobbyMusic.play(); if (p && p.catch) p.catch(() => {}); };

  document.addEventListener('pointerdown', tentarTocar, { once: true, capture: true });
}

  if (pvpMusicaLigada) tocarMusicaLobbyPvp();
  else pvpLobbyMusic?.pause();
}

  if (!sessao.session) { window.location.href = 'login.html'; return; }
  userId = sessao.session.user.id;

  const { data: player } = await sb.from('Player').select('bosses_derrotados, username, avatar_emoji, avatar_image_url, name_color')
    .eq('user_id', userId).single();

  const bosses = player?.bosses_derrotados || [];
  const derrotouBoss5 = Array.isArray(bosses) ? bosses.includes(5) : (bosses && bosses['5']);

  if (!derrotouBoss5) {
    document.getElementById('tela-bloqueado').classList.remove('hidden');
    return;
  }

  document.getElementById('tela-pvp').classList.remove('hidden');
  const nomeEl = document.getElementById('pvp-nome');
  nomeEl.textContent = player?.username || 'Jogador';
  nomeEl.style.color = player?.name_color || '#ffffff';
  colocarAvatarNoElemento(document.getElementById('pvp-avatar'), player?.avatar_image_url, player?.avatar_emoji || '🧙');

  try {
    await carregarPerfilPvp();
  } catch (e) {
    console.error('Falha ao carregar perfil PvP:', e);
    document.getElementById('painel-equip').innerHTML =
      '<div class="item-sub">Não foi possível carregar suas skills. Puxe pra atualizar ou reabra a Arena PvP.</div>';
  }
  renderEquip();
  carregarRanking();

  const { data: partidaAtiva } = await sb.from('pvp_matches')
    .select('id').eq('status', 'ativa')
    .or(`jogador1.eq.${userId},jogador2.eq.${userId}`)
    .maybeSingle();
  if (partidaAtiva) {
    matchAtual = partidaAtiva.id;
    await retomarPartidaAtiva(matchAtual);
  } else {
    tocarMusicaLobbyPvp();
    escutarPartidasNovas();
  }
}

async function retomarPartidaAtiva(matchId, tentativa) {
  tentativa = tentativa || 1;
  try {
    const { data: match, error: erroMatch } = await sb.from('pvp_matches').select('*').eq('id', matchId).maybeSingle();
    if (erroMatch) throw erroMatch;
    if (!match) {
      // Partida ainda não visível pra essa leitura (pequeno atraso de replicação/consistência).
      // Tenta de novo com um pequeno atraso em vez de desistir na primeira falha.
      if (tentativa < 6) {
        await new Promise(r => setTimeout(r, 400 * tentativa));
        return retomarPartidaAtiva(matchId, tentativa + 1);
      }
      return;
    }
    const oponenteId = match.jogador1 === userId ? match.jogador2 : match.jogador1;
    oponenteIdArena = oponenteId;
    const { data: oponentePerfil } = await sb.from('pvp_profile').select('rank, nivel_pvp, dano_upgrade_nivel, boss_equipado').eq('user_id', oponenteId).maybeSingle();
    // A tabela "Player" só permite (via RLS) cada um ler a própria linha — buscar direto
    // aqui pra pegar o nome/avatar do OPONENTE sempre voltava vazio, e por isso ele
    // aparecia como "Oponente" sem foto. Por isso usamos a RPC pública abaixo pro oponente.
    const { data: oponentePlayer } = await sb.rpc('pvp_dados_publicos_jogador', { p_user_id: oponenteId }).then(undefined, () => ({ data: null }));
    const { data: meuPlayer } = await sb.from('Player').select('username, avatar_emoji, avatar_image_url, name_color').eq('user_id', userId).maybeSingle();
    meuPlayerArena = meuPlayer || null;
    oponentePlayerArena = oponentePlayer || null;
    oponentePerfilArena = oponentePerfil || null;

    const { data: resolvido } = await sb.rpc('pvp_resolver_imagens', { p_match: matchId }).then(undefined, () => ({ data: null }));
    cenarioFinal = resolvido?.imagem_final || match.imagem_final || CENARIOS_PVP[0];

    entrarArena();
    sessionStorage.removeItem('pvpRetryMatch_' + matchId);
  } catch (e) {
    // Nunca falhar em silêncio — sem isso o jogador ficava "preso" no lobby sem nenhuma mensagem.
    console.error('Falha ao retomar a arena da partida ativa:', e);

    // Antes de desistir, tenta de novo algumas vezes com atraso — a maioria das falhas
    // aqui é um erro transitório de rede/timing, não um problema real de dados.
    if (tentativa < 6) {
      await new Promise(r => setTimeout(r, 400 * tentativa));
      return retomarPartidaAtiva(matchId, tentativa + 1);
    }

    // Evita o loop infinito de reload sem PUNIR ninguém com derrota (isso já causou
    // vitória/derrota "aleatória" quando o problema era só um travamento de tela, não desistência real).
    const chaveLoop = 'pvpRetryMatch_' + matchId;
    if (sessionStorage.getItem(chaveLoop)) {
      sessionStorage.removeItem(chaveLoop);
      alert('Não conseguimos carregar sua partida agora. Se o problema persistir, ela será cancelada automaticamente em alguns minutos (sem contar derrota). Tente novamente em instantes.');
      document.getElementById('overlay-busca')?.classList.add('hidden');
      document.getElementById('overlay-countdown')?.classList.add('hidden');
      document.getElementById('overlay-vs')?.classList.add('hidden');
      document.getElementById('overlay-cenario')?.classList.add('hidden');
      return;
    }

    sessionStorage.setItem(chaveLoop, '1');
    alert('Não foi possível carregar sua partida em andamento. Recarregando...');
    location.reload();
  }
}

// Escuta permanente de novas partidas (matchmaking OU desafio de amigo).
// Sem isso, quem é desafiado por um amigo nunca fica sabendo que a partida foi criada.
let novaPartidaChannel = null;
function escutarPartidasNovas() {
  if (novaPartidaChannel) return;
  novaPartidaChannel = sb.channel('pvp_nova_partida_'+userId)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pvp_matches', filter: `jogador1=eq.${userId}` }, (payload) => tratarNovaLinhaPvp(payload.new))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pvp_matches', filter: `jogador2=eq.${userId}` }, (payload) => tratarNovaLinhaPvp(payload.new))
    .subscribe();
}

function tratarNovaLinhaPvp(match) {
  if (match.status === 'convite') {
    // Só quem foi desafiado (jogador2) vê o popup de aceitar/recusar.
    if (match.jogador2 === userId) mostrarConvitePvp(match);
    else escutarRespostaConvite(match.id);
    return;
  }
  aceitarMatchEncontrado(match.id);
}

async function mostrarConvitePvp(match) {
  const { data: desafiante } = await sb.rpc('pvp_dados_publicos_jogador', { p_user_id: match.jogador1 }).then(undefined, () => ({ data: null }));
  const nome = desafiante?.username || 'Um jogador';
  const aceitou = confirm(`${nome} te desafiou para um combate!\n\nDeseja aceitar?`);
  const { data, error } = await sb.rpc('pvp_responder_desafio', { p_match: match.id, p_aceitar: aceitou }).then(undefined, e => ({ error: e }));
  if (error) { console.error('Falha ao responder desafio:', error); return; }
  if (data?.aceito) {
    matchAtual = match.id;
    await mostrarVs(match.id);
  }
}

// Quem desafiou espera a resposta ouvindo a MESMA linha (UPDATE) até virar 'ativa' ou 'cancelada'.
function escutarRespostaConvite(matchId) {
  const canal = sb.channel('pvp_resposta_convite_'+matchId)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pvp_matches', filter: `id=eq.${matchId}` }, (payload) => {
      if (payload.new.status === 'ativa') {
        sb.removeChannel(canal);
        matchAtual = matchId;
        mostrarVs(matchId);
      } else if (payload.new.status === 'cancelada') {
        sb.removeChannel(canal);
        alert('Seu desafio foi recusado ou expirou.');
      }
    })
    .subscribe();
}

function colocarAvatarNoElemento(el, imageUrl, emoji = '🧙') {
  if (!el) return;
  el.textContent = '';
  if (imageUrl) {
    const img = document.createElement('img');
    img.src = imageUrl;
    img.alt = 'Avatar do jogador';
    img.loading = 'eager';
    img.onerror = () => { el.textContent = emoji; };
    el.appendChild(img);
  } else {
    el.textContent = emoji;
  }
}

function linhaEvolucao(tipo, label, atual, lista) {
  const idx = lista.indexOf(atual);
  const max = idx >= lista.length - 1;
  const custo = max ? 0 : 40 * (idx + 1) * (idx + 1);
  const proximo = max ? null : lista[idx + 1];
  const cor = RARIDADE_COR[idx] || '#7b5cff';
  const nomeRaridade = RARIDADE_NOME[idx] || `Tier ${idx + 1}`;

  return `<div class="skill-evo-card" style="--sk-cor:${cor}">
    <div class="skill-evo-topo">
      <span class="skill-evo-label">${label}</span>
      <span class="skill-evo-raridade" style="color:${cor}">${nomeRaridade} • ${idx + 1}/${lista.length}</span>
    </div>
    <div class="skill-evo-corpo">
      <div class="skill-evo-icone">
        <img src="${atual}.gif" alt="${atual}" onerror="this.style.display='none'">
        <span class="skill-evo-nome-atual">${atual}</span>
      </div>
      ${proximo ? `
      <div class="skill-evo-seta">➜</div>
      <div class="skill-evo-icone prox">
        <img src="${proximo}.gif" alt="${proximo}" onerror="this.style.display='none'">
        <span class="skill-evo-nome-atual">${proximo}</span>
      </div>` : `<div class="skill-evo-maxtag">NÍVEL MÁXIMO</div>`}
    </div>
    <button class="btn-buy" style="width:100%;margin-top:8px" ${max ? 'disabled' : ''} onclick="evoluirSkill('${tipo}')">${max ? 'MAX' : '⬆ Evoluir por ' + custo + ' 🏆'}</button>

async function evoluirSkill(tipo) {
  const { data, error } = await sb.rpc('pvp_evoluir_skill', { p_tipo: tipo });
  if (error) { alert('Não foi possível evoluir: ' + error.message); return; }
  if (data?.nivel_maximo) { alert('NÍVEL MÁXIMO!'); return; }
  mostrarFlashEvolucao(data.anterior, data.novo);
  await refreshPerfil();
  renderEquip();

function mostrarFlashEvolucao(anterior, novo) {
  const div = document.createElement('div');

    <div class="promo-rank-new" style="color:var(--grad2)">${novo}</div>`;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 1600);
}

let filaChannel = null;

async function iniciarBusca() {
  const { error } = await sb.rpc('pvp_entrar_fila');
  if (error) {
    if (error.message === 'boss5_nao_derrotado') { alert('Derrote o Boss 5 primeiro!'); return; }
    if (error.message === 'partida_ativa_em_andamento') { await retomarPartidaExistente(); return; }
    alert(error.message);
    return;
  }
  matchJaAceito = false;
  document.getElementById('overlay-busca').classList.remove('hidden');
  searchFrame = 0;
  filaTimer = setInterval(pollFila, 1100); // era 2500ms — reduzido pra diminuir o delay até achar o VS
  pollFila();
  escutarPartidasNovas(); // já cobre o INSERT do match; não precisa duplicar o canal
}

// Busca a partida "ativa" do jogador direto no servidor e retoma na arena,
// em vez de só recarregar a página e torcer pro init() achar ela sozinho
// (é o que causava o jogador ficar preso na tela do lobby vendo sempre
// "partida em andamento" ao tentar batalhar de novo).
async function retomarPartidaExistente() {
  try {
    const { data: partidaAtiva } = await sb.from('pvp_matches')
      .select('id').eq('status', 'ativa')
      .or(`jogador1.eq.${userId},jogador2.eq.${userId}`)
      .maybeSingle();
    if (partidaAtiva) {
      matchAtual = partidaAtiva.id;
      await retomarPartidaAtiva(matchAtual);
    } else {
      // Servidor disse que havia partida ativa, mas ela já foi resolvida (cancelada
      // por inatividade ou finalizada) entre a checagem dele e essa consulta — não é
      // um erro real, é uma corrida inofensiva. Em vez de assustar com alerta e
      // recarregar a página à toa, tenta entrar na fila de novo direto.
      await iniciarBusca();
    }
  } catch (e) {
    // Nunca falhar em silêncio aqui — sem isso o clique em BATALHA não fazia nada visível.
    console.error('Falha ao retomar partida ativa:', e);
    alert('Você já tem uma partida em andamento, mas houve um erro ao carregá-la. Recarregando...');
    location.reload();
  }
}

let matchJaAceito = false;
async function aceitarMatchEncontrado(matchId) {
  if (matchJaAceito) return;
  matchJaAceito = true;
  clearInterval(filaTimer);
  if (filaChannel) { sb.removeChannel(filaChannel); filaChannel = null; }
  if (novaPartidaChannel) { sb.removeChannel(novaPartidaChannel); novaPartidaChannel = null; }
  document.getElementById('overlay-busca').classList.add('hidden');
  matchAtual = matchId;
  await mostrarVs(matchId);
}

async function pollFila() {
  searchFrame++;
  document.getElementById('search-symbol').textContent = 'S'.repeat(1 + (searchFrame % 3));
  const { data: matchId, error } = await sb.rpc('pvp_tentar_match');

  if (matchId) { await aceitarMatchEncontrado(matchId); return; }

  // Se já existe partida ativa pra esse jogador (ele foi pareado por outro jogador,
  // que criou a partida colocando ele como jogador2), a função acima só avisa via
  // exceção — antes isso era ignorado e o jogador ficava "procurando" pra sempre.
  // Checagem por .includes() (não só igualdade exata) porque a lib do Supabase
  // às vezes envolve a mensagem original em texto adicional.
  const avisouPartidaAtiva = error && typeof error.message === 'string' && error.message.includes('partida_ativa_em_andamento');

  // Rede de segurança extra: mesmo sem erro nenhum (ex.: falha silenciosa de rede
  // numa chamada isolada, ou corrida entre transações), a cada poll também
  // confere direto se já existe partida 'ativa' pro jogador — sem isso, se essa
  // única checagem de erro falhar, o jogador ficava preso em "procurando" até
  // o timeout de 5 minutos cancelar a partida sozinha.
  if (avisouPartidaAtiva || searchFrame % 3 === 0) {
    const { data: partidaAtiva } = await sb.from('pvp_matches')
      .select('id').eq('status', 'ativa')
      .or(`jogador1.eq.${userId},jogador2.eq.${userId}`)
      .maybeSingle();
    if (partidaAtiva) await aceitarMatchEncontrado(partidaAtiva.id);
  }
}

async function cancelarBusca() {
  clearInterval(filaTimer);
  matchJaAceito = true; // trava: ignora qualquer resposta de match que já estava "em voo"
  if (filaChannel) { sb.removeChannel(filaChannel); filaChannel = null; }
  document.getElementById('overlay-busca').classList.add('hidden');
  await sb.rpc('pvp_sair_fila');
}

let meuPlayerArena = null, oponentePlayerArena = null, oponentePerfilArena = null, oponenteIdArena = null;

async function mostrarVs(matchId) {
  document.getElementById('overlay-busca').classList.add('hidden');
  try {
    let match = null;
    for (let tentativa = 1; tentativa <= 5 && !match; tentativa++) {
      const { data } = await sb.from('pvp_matches').select('*').eq('id', matchId).maybeSingle();
      match = data;
      if (!match) await new Promise(r => setTimeout(r, 300 * tentativa));
    }
    if (!match) throw new Error('partida_nao_encontrada_apos_retries');
    const oponenteId = match.jogador1 === userId ? match.jogador2 : match.jogador1;
    oponenteIdArena = oponenteId;
    const { data: oponentePerfil } = await sb.from('pvp_profile').select('rank, nivel_pvp, dano_upgrade_nivel, boss_equipado').eq('user_id', oponenteId).maybeSingle();
    // Idem: "Player" só é legível pelo próprio dono via RLS, então o nome/foto do
    // oponente precisam vir por uma RPC pública (senão some e cai no fallback "Oponente").
    const { data: oponentePlayer } = await sb.rpc('pvp_dados_publicos_jogador', { p_user_id: oponenteId }).then(undefined, () => ({ data: null }));
    const { data: meuPlayer } = await sb.from('Player').select('username, avatar_emoji, avatar_image_url, name_color').eq('user_id', userId).maybeSingle();

    meuPlayerArena = meuPlayer || null;
    oponentePlayerArena = oponentePlayer || null;
    oponentePerfilArena = oponentePerfil || null;

    document.getElementById('vs-nome1').textContent = meuPlayer?.username || 'Você';
    document.getElementById('vs-nome1').style.color = meuPlayer?.name_color || '#ffffff';
    document.getElementById('vs-rank1').innerHTML = emblemaPatente(perfilAtual?.rank || 'bronze') + RANK_LABEL[perfilAtual?.rank || 'bronze'] + ' • Nv.' + (perfilAtual?.nivel_pvp||1);
    colocarAvatarNoElemento(document.getElementById('vs-avatar1'), meuPlayer?.avatar_image_url, meuPlayer?.avatar_emoji || '🧙');

    document.getElementById('vs-nome2').textContent = oponentePlayer?.username || 'Oponente';
    document.getElementById('vs-nome2').style.color = oponentePlayer?.name_color || '#ffffff';
    document.getElementById('vs-rank2').innerHTML = emblemaPatente(oponentePerfil?.rank || 'bronze') + RANK_LABEL[oponentePerfil?.rank || 'bronze'] + ' • Nv.' + (oponentePerfil?.nivel_pvp||1);
    colocarAvatarNoElemento(document.getElementById('vs-avatar2'), oponentePlayer?.avatar_image_url, oponentePlayer?.avatar_emoji || '🧙');

    document.getElementById('overlay-countdown').classList.remove('hidden');
    iniciarCountdown();
  } catch (e) {
    // Sem isso, qualquer falha aqui fazia o pareamento simplesmente "parar" e voltar
    // pro lobby, sem nenhum aviso — e a partida ficava presa como ativa no servidor.
    console.error('Falha ao mostrar a tela de VS:', e);
    matchAtual = matchId;
    await retomarPartidaAtiva(matchId);
  }
}

function iniciarCountdown() {
  let n = 5;
  const el = document.getElementById('countdown-num');
  el.textContent = n;
  const t = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(t);
      document.getElementById('overlay-countdown').classList.add('hidden');
      mostrarApresentacao();
      return;
    }
    el.textContent = n;
  }, 800);
}

function mostrarApresentacao() {
  document.getElementById('overlay-vs').classList.remove('hidden');
  // Antes eram 8s de "apresentação" + 15s de escolha manual de cenário = 23s parado
  // esperando o jogador — tempo de sobra pro navegador pausar a aba em segundo plano
  // e travar a partida pro outro lado. Agora escolhe o cenário sozinho e entra rápido.
  setTimeout(() => {
    document.getElementById('overlay-vs').classList.add('hidden');
    entrarNaArenaComCenarioAutomatico();
  }, 1500);
}

async function entrarNaArenaComCenarioAutomatico() {

/* ================= COMBATE (simplificado, HP/dano validados via RPC no servidor) ================= */
let hpMe = 1000, hpFoe = 1000, hpMeMax = 1000, hpFoeMax = 1000, souJogador1 = false, arenaPollTimer = null, dashCooldownAte = 0;
let ultimoSkill2Me = null, ultimoSkill2Foe = null, matchChannel = null;

// ===== MOVIMENTO LATERAL =====
let posMe = { x: 0, y: 0 }, posFoe = { x: 0, y: 0 }, moverLoopTimer = null;
const ESCUDO_COOLDOWN_MS = 6000; // precisa bater com o cooldown definido em pvp_usar_escudo

// Movimento livre em 2D (antes só dava pra ir pros lados). O jogador pode andar
// pra qualquer direção dentro do palco, mas nunca passa da "parede" nem some da
// tela — os limites em X e Y são recalculados com base no tamanho real do palco.
// posMe agora é {x, y} igual posFoe. O eixo X continua sendo o único sincronizado
// de verdade com o servidor (pvp_atualizar_pos), porque é o que a coluna j1_pos/j2_pos
// guarda e o que o pvp_usar_skill usa pra calcular o desvio — o Y é só visual/liberdade
// de movimento, não entra no cálculo de acerto (a mesma lógica do sistema de bosses,
// que também só considera o eixo lateral pra desviar).
function calcularLimitesMovimento() {
  const stage = document.getElementById('battle-stage');
  const fighter = document.getElementById('fighter-me');
  if (!stage || !fighter) return { x: 70, yTopo: 20, yBase: 20 };
  const larguraPalco = stage.clientWidth;
  const alturaPalco = stage.clientHeight;
  const larguraLutador = fighter.offsetWidth || 90;
  const alturaLutador = fighter.offsetHeight || 90;
  const limiteX = Math.max(40, (larguraPalco / 2) - (larguraLutador / 2) - 12);
  // Verticalmente o palco não é simétrico (tem a barra de HP em cima e os botões
  // embaixo por fora do palco), então damos uma margem de segurança maior pra não
  // deixar o personagem colado nessas bordas.
  const margemVertical = Math.max(30, alturaLutador / 2 + 16);
  const limiteY = Math.max(24, (alturaPalco / 2) - margemVertical);
  return { x: limiteX, y: limiteY };
}
let MOVE_LIMITE = calcularLimitesMovimento();
window.addEventListener('resize', () => { MOVE_LIMITE = calcularLimitesMovimento(); });

// Mostra a mesma animação de caminhada no lutador do oponente quando chega um
// pacote de movimento dele; some sozinha se parar de chegar posição nova
// (não temos um evento explícito de "parei" do lado do oponente).
let timerAndandoFoe = null;
function animarCaminhadaFoe() {
  const foeEl = document.getElementById('fighter-foe');
  if (!foeEl) return;
  foeEl.classList.add('andando');
  clearTimeout(timerAndandoFoe);
  timerAndandoFoe = setTimeout(() => foeEl.classList.remove('andando'), 220);
}

function aplicarPosicoes() {
  const meEl = document.getElementById('fighter-me');
  const foeEl = document.getElementById('fighter-foe');
  if (meEl) meEl.style.transform = `translate(${posMe.x}px, ${posMe.y}px)`;
  // o oponente vê o próprio lado espelhado, então aplicamos com sinal invertido no eixo X do meu lado
  if (foeEl) foeEl.style.transform = `translate(${-posFoe.x}px, ${posFoe.y}px)`;
}

// Sincroniza a posição real (só eixo X) com o servidor de tempos em tempos —
// é o valor que o pvp_usar_skill usa pra decidir se o golpe desviou ou não.
// Sem throttle isso spamaria a RPC a cada frame de movimento.
let ultimoEnvioPosServidor = 0;
let posServidorPendente = null;
function sincronizarPosServidor() {
  posServidorPendente = Math.round(posMe.x);
  const agora = Date.now();
  if (agora - ultimoEnvioPosServidor < 180) return;
  ultimoEnvioPosServidor = agora;
  const valor = posServidorPendente;
  posServidorPendente = null;
  sb.rpc('pvp_atualizar_pos', { p_match: matchAtual, p_pos: valor }).then(undefined, () => {});
}

// Velocidade de movimento (NÃO mexe na velocidade das skills/projéteis).
// Era 10px a cada 60ms; reduzida ~25% pra ficar mais lenta e natural, mas
// continua respondendo no mesmo intervalo (sem lag perceptível no toque).
const PASSO_MOVIMENTO = 7.5;

function iniciarMover(dirX, dirY) {
  clearInterval(moverLoopTimer);
  document.getElementById('fighter-me')?.classList.add('andando');
  moverPasso(dirX, dirY);
  moverLoopTimer = setInterval(() => moverPasso(dirX, dirY), 60);
}

function moverPasso(dirX, dirY) {
  posMe.x = Math.max(-MOVE_LIMITE.x, Math.min(MOVE_LIMITE.x, posMe.x + dirX * PASSO_MOVIMENTO));
  posMe.y = Math.max(-MOVE_LIMITE.y, Math.min(MOVE_LIMITE.y, posMe.y + dirY * PASSO_MOVIMENTO));
  aplicarPosicoes();
  if (matchChannel) matchChannel.send({ type: 'broadcast', event: 'mover', payload: { x: posMe.x, y: posMe.y } });
  sincronizarPosServidor();
}

function pararMover() {
  clearInterval(moverLoopTimer);
  moverLoopTimer = null;
  document.getElementById('fighter-me')?.classList.remove('andando');
  // garante que a última posição sempre chega no servidor, mesmo que o throttle
  // tenha segurado o último envio.
  if (posServidorPendente !== null && matchAtual) {
    const valor = posServidorPendente;
    posServidorPendente = null;
    ultimoEnvioPosServidor = Date.now();
    sb.rpc('pvp_atualizar_pos', { p_match: matchAtual, p_pos: valor }).then(undefined, () => {});
  }
}
window.iniciarMover = iniciarMover;
window.pararMover = pararMover;

// Joystick de arrastar em 2D — antes só media o eixo X (só dava pra ir pros lados).
(function configurarJoystick() {
  const base = document.getElementById('joystick-base');
  const knob = document.getElementById('joystick-knob');
  if (!base || !knob) return;

  const RAIO = 32;
  const ZONA_MORTA = 8;
  let arrastando = false;
  let dirXAtual = 0, dirYAtual = 0;
  let pointerId = null;

  function definirDirecao(novoX, novoY) {
    if (novoX === dirXAtual && novoY === dirYAtual) return;
    dirXAtual = novoX; dirYAtual = novoY;
    pararMover();
    if (novoX !== 0 || novoY !== 0) iniciarMover(novoX, novoY);
  }

  function mover(clientX, clientY) {
    const rect = base.getBoundingClientRect();
    const centroX = rect.left + rect.width / 2;
    const centroY = rect.top + rect.height / 2;
    let dx = clientX - centroX;
    let dy = clientY - centroY;
    const dist = Math.hypot(dx, dy);
    if (dist > RAIO) { dx = (dx / dist) * RAIO; dy = (dy / dist) * RAIO; }
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    const nx = Math.abs(dx) > ZONA_MORTA ? Math.sign(dx) : 0;
    const ny = Math.abs(dy) > ZONA_MORTA ? Math.sign(dy) : 0;
    definirDirecao(nx, ny);
  }

  function soltar() {
    if (!arrastando) return;
    arrastando = false;
    pointerId = null;
    knob.classList.remove('arrastando');
    knob.style.transform = 'translate(-50%, -50%)';
    definirDirecao(0, 0);
  }

  base.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    arrastando = true;
    pointerId = e.pointerId;
    knob.classList.add('arrastando');
    try { base.setPointerCapture(pointerId); } catch (_) {}
    mover(e.clientX, e.clientY);
  });
  base.addEventListener('pointermove', (e) => {
    if (!arrastando || e.pointerId !== pointerId) return;
    mover(e.clientX, e.clientY);
  });
  base.addEventListener('pointerup', soltar);
  base.addEventListener('pointercancel', soltar);
  base.addEventListener('lostpointercapture', soltar);
})();

// Se o oponente cai/fecha o app/sai de raiva, o Realtime avisa que ele saiu do canal (evento 'leave').
// Espera um tempo curto (reconexões rápidas de wifi/4g não devem contar como abandono) e, se ele
// não voltar, declara vitória automática pra quem ficou.
let abandonoTimer = null;
function agendarChecagemAbandono() {
  if (!matchAtual) return;
  clearTimeout(abandonoTimer);
  abandonoTimer = setTimeout(async () => {
    if (!matchAtual) return;
    const { error } = await sb.rpc('pvp_declarar_abandono', { p_match: matchAtual }).then(undefined, e => ({ error: e }));

      document.getElementById('arena-log').textContent = 'Oponente desconectou — vitória!';
    }
  }, 8000); // 8s de tolerância antes de considerar abandono
}
function cancelarChecagemAbandono() {
  clearTimeout(abandonoTimer);
  abandonoTimer = null;
}

function sairDaArenaRealtime() {
  if (matchChannel) { sb.removeChannel(matchChannel); matchChannel = null; }
  clearInterval(arenaPollTimer);
  cancelarChecagemAbandono();
  pararMover();
}

async function pollEstadoPartida() {
  const { data: m } = await sb.from('pvp_matches').select('hp1,hp2,status,vencedor,ultimate_lock_owner,ultimate_lock_expira_em,j1_skill2_at,j2_skill2_at').eq('id', matchAtual).single();
  if (m) processarEstadoPartida(m);
}

let ultimateLockOponenteAtivoFlag = false;
function ultimateLockOponenteAtivo() { return ultimateLockOponenteAtivoFlag; }

async function processarEstadoPartida(m) {
  if (!m) return;
  // hp1/hp2 podem chegar nulos/indefinidos num update fora de hora (ex.: logo após a
  // escolha do cenário, antes do combate realmente começar no servidor). Nesse caso
  // ignoramos o valor em vez de tratar como HP zerado, senão a partida termina sozinha
  // e o jogador volta pro lobby com a partida ainda marcada como "ativa" no servidor.
  const novoHpMe = souJogador1 ? m.hp1 : m.hp2;
  const novoHpFoe = souJogador1 ? m.hp2 : m.hp1;
  aplicarHp(Number.isFinite(novoHpMe) ? novoHpMe : hpMe, Number.isFinite(novoHpFoe) ? novoHpFoe : hpFoe);
  // Corrigido: a comparação de dono do lock precisa ser feita como texto (String +
  // trim), porque um espaço/tipo diferente entre o id salvo no banco e o userId
  // local fazia "meu próprio lock" ser lido como "lock do oponente" (o bug de às
  // vezes aparecer "inimigo usando Ultimate" sem ninguém usando). Também só conta
  // como ocupado se o dono for realmente OUTRO jogador e o prazo ainda não passou —
  // sem isso, nunca é considerado ocupado.
  const donoLock = m.ultimate_lock_owner ? String(m.ultimate_lock_owner).trim() : '';
  const meuId = String(userId || '').trim();
  const prazoValido = m.ultimate_lock_expira_em && new Date(m.ultimate_lock_expira_em).getTime() > Date.now();
  const ultimateOcupada = !!(donoLock && donoLock !== meuId && prazoValido);
  ultimateLockOponenteAtivoFlag = ultimateOcupada;
  // não sobrescreve o botão enquanto EU estou no meio da minha própria animação de
  // Ultimate (senão o poll de 4s podia reabilitar/desabilitar o botão no meio do
  // meu próprio uso); fora disso, o botão sempre reflete o lock real do servidor.
  if (!ultimateEmUso) document.getElementById('btn-ultimate').disabled = ultimateOcupada;

  // detecta skill2 do oponente pra tocar Impacto.mp3
  const skill2FoeAgora = souJogador1 ? m.j2_skill2_at : m.j1_skill2_at;
  if (skill2FoeAgora && skill2FoeAgora !== ultimoSkill2Foe) {
    ultimoSkill2Foe = skill2FoeAgora;
    if (typeof window.playSfx === 'function') window.playSfx('Impacto.mp3', 0.5);
  }

  if (m.status !== 'ativa' || hpMe <= 0 || hpFoe <= 0) {
    clearInterval(arenaPollTimer);
    let vencedorFinal = m.vencedor || null;
    if (!vencedorFinal) {
      if (hpFoe <= 0 && hpMe > 0) vencedorFinal = userId;
      else if (hpMe <= 0 && hpFoe > 0) vencedorFinal = oponenteIdArena;
      else if (hpFoe <= 0 && hpMe <= 0) vencedorFinal = null; // os dois zeraram juntos: deixa o servidor decidir
    }
    await finalizarPartida(vencedorFinal);
  }
}

function atualizarHpBars() {
  document.getElementById('arena-hp-me').style.width = Math.max(0, hpMe/hpMeMax*100)+'%';
  document.getElementById('arena-hp-foe').style.width = Math.max(0, hpFoe/hpFoeMax*100)+'%';
  document.getElementById('arena-hp-me-txt').textContent = `${Math.max(0,hpMe)}/${hpMeMax}`;
  document.getElementById('arena-hp-foe-txt').textContent = `${Math.max(0,hpFoe)}/${hpFoeMax}`;
}

// Aplica novos valores de HP e dispara os efeitos visuais (dano/cura/shake/knockout).
// Sempre usar isso em vez de atribuir hpMe/hpFoe direto, senão o combate visual some.
function aplicarHp(novoMe, novoFoe) {
  const deltaMe = novoMe - hpMe;
  const deltaFoe = novoFoe - hpFoe;
  hpMe = novoMe; hpFoe = novoFoe;
  atualizarHpBars();
  if (deltaFoe < -0.5) efeitoImpacto('foe', Math.round(-deltaFoe));
  else if (deltaFoe > 0.5) efeitoImpacto('foe', Math.round(deltaFoe), 'cura');
  if (deltaMe < -0.5) efeitoImpacto('me', Math.round(-deltaMe));
  else if (deltaMe > 0.5) efeitoImpacto('me', Math.round(deltaMe), 'cura');
  if (hpMe <= 0) document.getElementById('fighter-me')?.classList.add('ko');
  if (hpFoe <= 0) document.getElementById('fighter-foe')?.classList.add('ko');
}

function efeitoImpacto(lado, valor, tipo) {
  const fighterEl = document.getElementById(lado === 'me' ? 'fighter-me' : 'fighter-foe');
  const popZone = document.getElementById(lado === 'me' ? 'dmg-pop-me' : 'dmg-pop-foe');
  if (!fighterEl || !popZone) return;
  if (tipo !== 'cura') {
    fighterEl.classList.remove('hit'); void fighterEl.offsetWidth; fighterEl.classList.add('hit');
    const arenaEl = document.getElementById('arena');
    if (arenaEl) { arenaEl.classList.remove('shake'); void arenaEl.offsetWidth; arenaEl.classList.add('shake'); }
  }
  const pop = document.createElement('div');
  pop.className = 'dmg-pop' + (tipo === 'cura' ? ' heal' : '');
  pop.textContent = (tipo === 'cura' ? '+' : '-') + valor;
  popZone.appendChild(pop);
  setTimeout(() => pop.remove(), 850);
}

// Cooldowns visuais das skills — os mesmos tempos usados de verdade no servidor
// (pvp_usar_skill): 1.2s pra skill1, 3s pra skill2. O servidor continua sendo quem
// valida de fato (bloqueia com "em_cooldown" se tentar antes da hora); isso aqui é
// só o botão mostrando quanto falta, que antes não existia nenhum feedback visual.
const COOLDOWN_SKILL1_PVP_MS = 1100;
const COOLDOWN_SKILL2_PVP_MS = 4000;
let cdSkill1At = 0, cdSkill2At = 0;

function iniciarCooldownVisual(n, duracaoMs) {
  const btn = document.getElementById(n === 1 ? 'btn-skill1' : 'btn-skill2');
  const label = document.getElementById(n === 1 ? 'cd-skill1' : 'cd-skill2');
  if (!btn || !label) return;
  const fim = Date.now() + duracaoMs;
  if (n === 1) cdSkill1At = fim; else cdSkill2At = fim;
  btn.classList.add('em-cooldown');
  const tick = () => {
    const restante = fim - Date.now();
    if (restante <= 0) {
      btn.classList.remove('em-cooldown');
      label.textContent = '';
      return;
    }
    label.textContent = (restante / 1000).toFixed(1) + 's';
    requestAnimationFrame(tick);
  };
  tick();
}

// Mostra o próprio gif da skill em cima do lutador quando ela é usada (reaproveita
// os arquivos que já existem — RelampagoSkill1.gif, RaioSkill2.gif, Ultimate7.gif etc).
// ladoEl é o elemento .fighter (fighter-me ou fighter-foe); some sozinho depois de um tempo.
function mostrarEfeitoSkill(ladoEl, gifFile) {
  if (!ladoEl || !gifFile) return;
  const fx = document.createElement('img');
  fx.src = gifFile;
  fx.className = 'skill-fx-img';
  fx.alt = '';
  fx.onerror = () => fx.remove();
  ladoEl.appendChild(fx);
  setTimeout(() => fx.remove(), 750);
}

// Antes o gif da skill só piscava 1s em cima de quem atacou e o dano/servidor já
// tinha sido aplicado ao mesmo tempo — parecia que a skill não "viajava" até o
// alvo, ou viajava rápido demais pra sequer conseguir desviar. Agora o gif vira
// um projétil de verdade: nasce em cima de quem usou, faz uma curva até o alvo
// (recalculando a posição dele a cada frame — "autoguiado" leve) e só então a
// gente aplica o efeito de acerto/dano visual. O servidor continua sendo a
// única autoridade sobre o dano/desvio: essa animação nunca decide dano
// sozinha, ela só atrasa VISUALMENTE o "aplicarHp"/"efeitoImpacto" que já veio
// pronto da resposta do RPC, pra sincronizar com a chegada do golpe.
// NERF DE VELOCIDADE (pedido: "muito rápida, quase impossível desviar"):
// era 460ms (quase instantâneo) -> agora 820ms. Ainda ágil, só dá tempo de reagir.
const DURACAO_PROJETIL_MS = 820;
function dispararProjetil(gifFile, atacanteEl, alvoEl, aoChegar) {
  const stage = document.getElementById('battle-stage');
  if (!stage || !atacanteEl || !alvoEl || !gifFile) { aoChegar && aoChegar(); return; }

  const proj = document.createElement('div');
  proj.className = 'skill-projectile';
  const img = document.createElement('img');
  img.src = gifFile;
  img.alt = '';
  img.onerror = () => { proj.remove(); };
  proj.appendChild(img);
  stage.appendChild(proj);

  function centroRelativoAoPalco(el) {
    const r = el.getBoundingClientRect();
    const s = stage.getBoundingClientRect();
    return { x: r.left + r.width / 2 - s.left - 32, y: r.top + r.height / 2 - s.top - 32 };
  }

  const origem = centroRelativoAoPalco(atacanteEl);
  // Ponto de controle da curva: acima do meio do caminho (arco leve, tipo
  // "lançamento em parábola"), não uma linha reta chapada.
  const destinoInicial = centroRelativoAoPalco(alvoEl);
  const ALTURA_CURVA = 70;
  const meioX = (origem.x + destinoInicial.x) / 2;
  const meioY = Math.min(origem.y, destinoInicial.y) - ALTURA_CURVA;

  // Se o alvo está à esquerda de quem atacou, espelha o gif horizontalmente —
  // sem isso a skill "olha" pro lado errado (o que estava saindo engraçado,
  // como se o personagem usasse a skill ao contrário).
  if (destinoInicial.x < origem.x) img.style.transform = 'scaleX(-1)';

  let terminou = false;
  const t0 = performance.now();

  function passo(agora) {
    if (terminou) return;
    const t = Math.min(1, (agora - t0) / DURACAO_PROJETIL_MS);
    // recalcula o alvo a cada frame -> leve autoguiado (o alvo pode ter se mexido),
    // mas mantém a curva (Bézier quadrática) em vez de ir reto.
    const destino = centroRelativoAoPalco(alvoEl);
    const umMenosT = 1 - t;
    const x = umMenosT * umMenosT * origem.x + 2 * umMenosT * t * meioX + t * t * destino.x;
    const y = umMenosT * umMenosT * origem.y + 2 * umMenosT * t * meioY + t * t * destino.y;
    proj.style.transform = `translate(${x}px, ${y}px)`;
    if (t < 1) {
      requestAnimationFrame(passo);
    } else {
      terminou = true;
      proj.remove();
      aoChegar && aoChegar();
    }
  }
  requestAnimationFrame(passo);
}

async function usarSkill(n) {
  // já em cooldown no cliente? nem tenta chamar o servidor
  const cdAtivoAte = n === 1 ? cdSkill1At : cdSkill2At;
  if (Date.now() < cdAtivoAte) return;

  // Mira na última posição conhecida do oponente (visto pelo realtime). Se ele já
  // tiver se mexido bastante desde então, o servidor conta como desvio — mesma
  // ideia do desvio de skills na luta contra bosses, só que agora os dois lados
  // se mexem de verdade.
  const posMirado = Math.round(posFoe.x);
  const { data, error } = await sb.rpc('pvp_usar_skill', { p_match: matchAtual, p_tipo: 'skill'+n, p_pos_mirado: posMirado });
  if (error) {
    if (error.message === 'em_cooldown') {
      document.getElementById('arena-log').textContent = 'Skill em recarga...';
      iniciarCooldownVisual(n, n === 1 ? COOLDOWN_SKILL1_PVP_MS : COOLDOWN_SKILL2_PVP_MS);
    } else {
      document.getElementById('arena-log').textContent = 'Ação inválida';
    }
    return;
  }
  iniciarCooldownVisual(n, n === 1 ? COOLDOWN_SKILL1_PVP_MS : COOLDOWN_SKILL2_PVP_MS);
  if (n === 2 && typeof window.playSfx === 'function') window.playSfx('Impacto.mp3', 0.5);
  const gif = (n === 1 ? perfilAtual?.skill1_pvp : perfilAtual?.skill2_pvp) + '.gif';
  if (matchChannel) matchChannel.send({ type: 'broadcast', event: 'skillfx', payload: { gif } });
  document.getElementById('arena-log').textContent = data.desviou ? 'Oponente desviou parte do golpe!' : `Você usou Skill ${n}!`;
  // Dano só é aplicado visualmente quando o projétil chega no alvo — o servidor
  // já decidiu se acertou ou desviou, isso aqui só sincroniza a animação.
  dispararProjetil(gif, document.getElementById('fighter-me'), document.getElementById('fighter-foe'), () => {
    if (!data.desviou) mostrarEfeitoSkill(document.getElementById('fighter-foe'), gif);
    aplicarHp(souJogador1 ? data.hp1 : data.hp2, souJogador1 ? data.hp2 : data.hp1);
    if (data.fim) { clearInterval(arenaPollTimer); finalizarPartida(data.vencedor); }
  });
}

// Vídeo da Ultimate — reaproveita o mesmo padrão de arquivo já usado na batalha
// dos bosses (Ultimate{N}.mp4, ver dispararCutsceneUltimate em batalha.js) em vez
// de criar um sistema novo. Diferença proposital pro PvP: aqui NÃO pausamos o
// jogo (os dois jogadores continuam em tempo real por trás do vídeo) e tem
// botão de pular — se qualquer um dos dois pular, fecha pros dois.
let finalizarVideoUltimateAtual = null;
function mostrarVideoUltimatePvp(ultimateId) {
  const overlay = document.getElementById('ultimate-video-overlay');
  const video = document.getElementById('ultimate-video-pvp');
  if (!overlay || !video) return;

  // se já tinha um vídeo tocando (não deveria, mas por segurança), fecha antes
  if (finalizarVideoUltimateAtual) finalizarVideoUltimateAtual(true);

  const numero = String(ultimateId || '').replace('Ultimate', '') || '7';
  const arquivo = 'Ultimate' + numero + '.mp4';

  let terminou = false;
  const finalizar = (semAvisar) => {
    if (terminou) return;
    terminou = true;
    finalizarVideoUltimateAtual = null;
    overlay.classList.remove('ativo');
    setTimeout(() => overlay.classList.add('hidden'), 180);
    video.onended = null;
    video.onerror = null;
    video.pause();
    video.removeAttribute('src');
    if (typeof window.restoreBossMusic === 'function') window.restoreBossMusic();
    // avisa o outro lado só quando EU fechei de verdade (clique no pular),
    // não quando eu estou fechando por TER RECEBIDO o aviso do outro lado
    if (!semAvisar && matchChannel) matchChannel.send({ type: 'broadcast', event: 'ultimateskip', payload: {} });
  };
  finalizarVideoUltimateAtual = finalizar;

  video.onerror = () => finalizar();
  video.onended = () => finalizar();
  video.src = arquivo;
  overlay.classList.remove('hidden');
  requestAnimationFrame(() => overlay.classList.add('ativo'));
  if (typeof window.duckBossMusic === 'function') window.duckBossMusic();
  const promessa = video.play();
  if (promessa && promessa.catch) promessa.catch(() => finalizar());

  // trava de segurança: nunca fica travado na tela nem impede outras ações —
  // se o vídeo não terminar sozinho em 6s (arquivo grande/corrompido, navegador
  // estranho no celular etc.), força o fim sem travar a partida.
  setTimeout(() => finalizar(), 6000);
}

// Se o oponente (ou eu, em outra aba) pulou o vídeo, fecha aqui também sem
// mandar um segundo aviso de volta (senão vira ping-pong de broadcast).
function receberSkipVideoUltimate() {
  if (finalizarVideoUltimateAtual) finalizarVideoUltimateAtual(true);
}


let ultimateEmUso = false;
async function usarUltimate() {
  if (ultimateEmUso) return;
  const btn = document.getElementById('btn-ultimate');
  ultimateEmUso = true;
  if (btn) btn.disabled = true;

  try {
    const { data: liberado, error } = await sb.rpc('pvp_ativar_ultimate', { p_match: matchAtual, p_duracao_ms: 3000 });
    if (error || !liberado) {
      document.getElementById('arena-log').textContent = 'Ultimate bloqueada — oponente já está usando a dele!';
      return;
    }
    document.getElementById('arena-log').textContent = 'ULTIMATE ATIVADA!';
    const ultimateId = perfilAtual?.ultimate_pvp || 'Ultimate7';
    mostrarVideoUltimatePvp(ultimateId);
    if (matchChannel) matchChannel.send({ type: 'broadcast', event: 'ultimatevideo', payload: { ultimateId } });

    await new Promise((resolve) => setTimeout(resolve, 1000));

    const posMirado = Math.round(posFoe.x);
    const { data, error: err2 } = await sb.rpc('pvp_usar_skill', { p_match: matchAtual, p_tipo: 'ultimate', p_pos_mirado: posMirado });
    if (err2) {
      document.getElementById('arena-log').textContent = 'Falha ao usar Ultimate. Tente de novo.';
      return;
    }
    const gifUlt = (perfilAtual?.ultimate_pvp || 'Ultimate7') + '.gif';
    if (matchChannel) matchChannel.send({ type: 'broadcast', event: 'skillfx', payload: { gif: gifUlt } });
    document.getElementById('arena-log').textContent = data.desviou ? 'Oponente desviou parte do golpe!' : 'ULTIMATE ACERTOU!';
    dispararProjetil(gifUlt, document.getElementById('fighter-me'), document.getElementById('fighter-foe'), () => {
      if (!data.desviou) mostrarEfeitoSkill(document.getElementById('fighter-foe'), gifUlt);
      aplicarHp(souJogador1 ? data.hp1 : data.hp2, souJogador1 ? data.hp2 : data.hp1);
      if (data.fim) { clearInterval(arenaPollTimer); finalizarPartida(data.vencedor); }
    });
  } finally {
    ultimateEmUso = false;
    // Não reabilita o botão às cegas: só reabilita se, pelo estado mais recente
    // conhecido da partida, ninguém (nem o oponente) está com o lock ativo —
    // evita mostrar o botão livre por um instante e depois "voltar" a travar.
    if (btn) btn.disabled = !!ultimateLockOponenteAtivo();
  }
}


async function usarEscudo() {
  const { data: ok } = await sb.rpc('pvp_usar_escudo', { p_match: matchAtual });
  if (!ok) {
    document.getElementById('arena-log').textContent = 'Escudo em recarga...';
    return;
  }
  document.getElementById('arena-log').textContent = 'Escudo ativado! -70% de dano por 1,5s.';
  const btn = document.getElementById('btn-escudo');
  const fighterEl = document.getElementById('fighter-me');
  btn.classList.add('ativo');
  btn.disabled = true;
  fighterEl?.classList.add('escudo-ativo');
  setTimeout(() => fighterEl?.classList.remove('escudo-ativo'), 1500);
  setTimeout(() => { btn.classList.remove('ativo'); btn.disabled = false; }, ESCUDO_COOLDOWN_MS);
}

async function confirmarDesistencia() {
  if (!confirm('Tem certeza que quer desistir? Isso conta como derrota.')) return;
  await desistirPartida();
}
window.confirmarDesistencia = confirmarDesistencia;

async function desistirPartida() {
  clearInterval(arenaPollTimer);
  const rankAntes = perfilAtual?.rank;
  const { data, error } = await sb.rpc('pvp_desistir', { p_match: matchAtual }).then(undefined, e => ({ error: e }));
  if (error) { alert('Erro: ' + (error.message || 'não foi possível desistir')); return; }
  sairDaArenaRealtime();
  if (typeof window.stopBossMusic === 'function') window.stopBossMusic();
  if (typeof window.playDefeatSound === 'function') window.playDefeatSound();
  document.getElementById('arena').classList.add('hidden');
  tocarMusicaLobbyPvp();
  matchJaAceito = false;
  escutarPartidasNovas();
  await refreshPerfil();
  compararRankEMostrarOverlay(rankAntes);
  renderEquip();
}
window.desistirPartida = desistirPartida;

async function finalizarPartida(vencedor) {
  clearInterval(arenaPollTimer);
  sairDaArenaRealtime();
  if (typeof window.stopBossMusic === 'function') window.stopBossMusic();
  if (!vencedor) {
    document.getElementById('arena').classList.add('hidden');
    tocarMusicaLobbyPvp();
    matchJaAceito = false;
    escutarPartidasNovas();
    await refreshPerfil();
    renderEquip();
    return;
  }
  const euGanhei = vencedor === userId;
  if (euGanhei) { if (typeof window.playVictorySound === 'function') window.playVictorySound(); }
  else { if (typeof window.playDefeatSound === 'function') window.playDefeatSound(); }
  const rankAntes = perfilAtual?.rank;
  const { data: resultadoPartida } = await sb.rpc('pvp_registrar_resultado', { p_match: matchAtual, p_vencedor: vencedor }).then((r) => r, () => ({ data: null }));
  document.getElementById('arena').classList.add('hidden');
  tocarMusicaLobbyPvp();
  matchJaAceito = false;
  escutarPartidasNovas();
  await refreshPerfil();
  if (euGanhei && resultadoPartida) {
    mostrarRecompensaPvp(resultadoPartida, rankAntes);
  } else {
    compararRankEMostrarOverlay(rankAntes);
  }
  renderEquip();
}

function mostrarRecompensaPvp(resultado, rankAntes) {
  const lista = document.getElementById('recompensa-lista-pvp');
  const linhas = [
    `<div class="recompensa-item"><span>🏆 Troféus</span><b>+${resultado.trofeus_ganhos || 0}</b></div>`,
    `<div class="recompensa-item"><span>⭐ XP</span><b>+${resultado.xp_ganho || 0}</b></div>`
  ];
  if (resultado.bonus_moedas > 0) linhas.push(`<div class="recompensa-item"><span>🪙 Moedas (Poção)</span><b>+${resultado.bonus_moedas}</b></div>`);
  if (resultado.bonus_diamantes > 0) linhas.push(`<div class="recompensa-item"><span>💎 Diamantes (Poção)</span><b>+${resultado.bonus_diamantes}</b></div>`);
  lista.innerHTML = linhas.join('');

  const overlay = document.getElementById('overlay-recompensa-pvp');
  overlay.classList.remove('hidden');

  // guarda o rankAntes pra comparar depois que o jogador fechar o card de recompensas
  overlay.dataset.rankAntes = rankAntes || '';
}

function fecharOverlayRecompensaPvp() {
  const overlay = document.getElementById('overlay-recompensa-pvp');
  const rankAntes = overlay.dataset.rankAntes || null;
  overlay.classList.add('hidden');
  if (rankAntes) compararRankEMostrarOverlay(rankAntes);
}

// Comparação local (funciona pros dois jogadores, mesmo que só um deles tenha
// conseguido executar pvp_registrar_resultado por causa da corrida entre os clientes).
const ORDEM_RANK = ['bronze','prata','ouro','diamante','desafiante'];
function compararRankEMostrarOverlay(rankAntes) {
  if (!rankAntes || !perfilAtual || perfilAtual.rank === rankAntes) return;
  const antes = ORDEM_RANK.indexOf(rankAntes);
  const depois = ORDEM_RANK.indexOf(perfilAtual.rank);
  mostrarPromocao(rankAntes, perfilAtual.rank, depois < antes);
}

function mostrarPromocao(rankAntigo, novoRank, desceu) {
  const overlay = document.getElementById('overlay-promocao');
  document.getElementById('promo-rank-old').textContent = RANK_LABEL[rankAntigo] || '';
  document.getElementById('promo-rank-new').textContent = RANK_LABEL[novoRank];
  document.getElementById('promo-rank-new').style.color = desceu ? '#ff5050' : RANK_COLORS[novoRank];
  document.getElementById('promo-arrow').textContent = desceu ? '↓' : '↑';
  overlay.classList.toggle('rebaixamento', desceu);
  const particles = document.getElementById('promo-particles');
  particles.innerHTML = '';
  if (!desceu) {
    for (let i=0;i<16;i++){
      const d = document.createElement('div');
      d.className='p-dot';
      d.style.left = (10+Math.random()*80)+'%';
      d.style.bottom = '30%';
      d.style.animationDelay = (Math.random()*.4)+'s';
      particles.appendChild(d);
    }
  }
  overlay.classList.remove('hidden');
  setTimeout(()=>overlay.classList.add('hidden'), 2600);
}

init();
